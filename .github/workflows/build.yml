name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025  # ships VS 2026 (v145), same as local
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # microsoft/setup-msbuild v2
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build Release x64
        run: >-
          msbuild UniversalAppControl.sln /m
          /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: Run selftest
        shell: pwsh
        # GUI exe: wait on the process; exit code = failure count.
        run: |
          $exe = 'x64\Release\UniversalAppControl.exe'
          $p = Start-Process $exe --selftest -Wait -PassThru
          Get-Content "$env:TEMP\uac-selftest.txt"
          exit $p.ExitCode

      - name: Upload executable
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniversalAppControl-Release-x64
          path: x64/Release/UniversalAppControl.exe
          if-no-files-found: error

  release:
    # Separate job so only tag builds get a write token.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/download-artifact v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: UniversalAppControl-Release-x64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" UniversalAppControl.exe
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
